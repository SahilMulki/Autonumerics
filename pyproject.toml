[project]
name = "autonumerics"
version = "0.1.0"
description = "Agent pipeline that designs, implements, and independently verifies numerical solvers for SDEs and PDEs."
requires-python = ">=3.13"
dependencies = [
    # 2.0 is a floor, not a preference: `np.trapezoid` is a numpy-2 name (1.x spells
    # it `np.trapz`) and 15 call sites across `verifylib/` and `benchmark/` use it.
    # The old `>=1.26.0` was satisfiable by a numpy that cannot run the suite --
    # measured on 1.26.4: 5 failures, all `np.trapezoid`, all PDE-side.
    # `test_project_metadata.py` holds this floor to the APIs actually called.
    "numpy>=2.0.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "ruff>=0.9.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
# Test fixtures are archived pipeline artifacts, preserved byte-for-byte because
# the leakage tests assert on their exact text. Never lint or reformat them.
extend-exclude = ["outputs_new_paper", "verifylib/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["verifylib", "benchmark/tests"]
markers = [
    "slow: rebuilds a harness reference from scratch (40 s+ each); run with `-m slow`",
]
addopts = "-m 'not slow'"
